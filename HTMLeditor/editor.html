<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Full HTML Editor</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; background: #2d2d2d; color: white; font-family: sans-serif; overflow: hidden; }
        .panel { flex: 1; display: flex; flex-direction: column; }
        .label { background: #1e1e1e; padding: 8px 15px; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        textarea { flex: 1; padding: 15px; font-family: 'Consolas', monospace; font-size: 14px; border: none; background: #252526; color: #d4d4d4; resize: none; outline: none; }
        iframe { flex: 1; border: none; background: white; }
    </style>
</head>
<body>

    <div class="panel">
        <div class="label">HTML Код</div>
        <textarea id="code" spellcheck="false"></textarea>
    </div>

    <div class="panel">
        <div class="label">Результат отображения кода в браузере</div>
        <iframe id="output"></iframe>
    </div>

    <script>
        const textarea = document.getElementById('code');
        const output = document.getElementById('output');

        function update() {
            const doc = output.contentDocument || output.contentWindow.document;
            doc.open();
            doc.write(textarea.value);
            doc.close();
        }

        textarea.addEventListener('input', update);

        // Твой шаблон
        textarea.value = `<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Моя страница</title>
    <style>
      body { font-family: sans-serif; text-align: center; padding-top: 50px; }
      h1 { color: #007bff; }
    </style>
  </head>
  <body>
    <h1>Привет!</h1>
    <p>Начни менять код слева.</p>
  </body>
</html>`;

        update();
    </script>
</body>
</html>
